name: zivlo
description: Punto de venta offline-first para pequeños comercios en Latinoamérica
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.3'

dependencies:
  flutter:
    sdk: flutter

  # BLoC - State Management (versiones estables compatibles)
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2

  # Base de datos local - Hive
  hive_flutter: ^1.1.0
  sqflite: 2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  file_picker: 8.3.7
  share_plus: 10.1.4
  pdf: 3.11.3
  printing: 5.14.2

  # Navegación - GoRouter
  go_router: ^13.2.0

  # Manejo funcional de errores - fpdart
  fpdart: ^1.1.0

  # Hardware - Escáner de código de barras
  mobile_scanner: ^5.1.1

  # Hardware - Impresora Bluetooth (TEMPORALMENTE COMENTADO - problema de namespace)
  # blue_thermal_printer: ^1.2.3
  # Alternativas a evaluar:
  # - esc_pos_bluetooth
  # - bluetooth_print
  # - pos_universal_printer

  # Inyección de dependencias - GetIt
  get_it: ^7.6.4

  # Utils
  equatable: ^2.0.5
  uuid: ^4.3.3
  intl: ^0.19.0

  # Fonts de Google
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing - sin conflictos con Hive
  bloc_test: ^9.1.5
  mocktail: ^1.0.2
  sqflite_common_ffi: 2.3.5

  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true


  # Fonts - commented out until font files are added
