name: Build Android test APK
on:
  push:
    branches: [codex/zivlo-peru-native]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Prepare Android application
        run: bash scripts/prepare-android.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/zivlo-analyze.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/zivlo-analyze.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          errors = [line for line in Path(os.environ['RUNNER_TEMP'], 'zivlo-analyze.log').read_text().splitlines() if line.strip().startswith('error ')]
          if errors:
              print('::error::' + '\n'.join(errors).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          exit "$result"
      - name: Validate before packaging
        run: |
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/zivlo-tests.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/zivlo-tests.log"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'zivlo-tests.log').read_text().splitlines()[-100:]
          print('::error::' + '\n'.join(lines).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          else
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'zivlo-tests.log').read_text().splitlines()
          for line in lines[-5:]:
              print('::notice::' + line.replace('%', '%25').replace('\r', '%0D'))
          PY
          fi
          exit "$result"
      - name: Build debug APK for testing
        run: flutter build apk --debug
      - name: Checksum
        working-directory: build/app/outputs/flutter-apk
        run: |
          sha256sum app-debug.apk > app-debug.apk.sha256
          echo "::notice::APK generated: $(stat -c '%s' app-debug.apk) bytes; $(cat app-debug.apk.sha256)"
      - uses: actions/upload-artifact@v4
        with:
          name: zivlo-peru-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
            pubspec.lock
          if-no-files-found: error
          retention-days: 14
