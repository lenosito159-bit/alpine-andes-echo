name: Validate Zivlo Perú
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Prepare Android without overwriting application source
        run: bash scripts/prepare-android.sh
      - name: Resolve compatible dependencies
        run: flutter pub get
      - name: Analyze all Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Domain, SQLite, migration, BLoC and widget tests
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zivlo-test-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
